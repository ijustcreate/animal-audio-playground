name: Privacy and source checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate the synthetic fixture
        run: npm run sample:generate
      - name: Confirm generated media is reproducible
        run: git diff --exit-code
      - name: Validate privacy boundary and source syntax
        run: npm run check
